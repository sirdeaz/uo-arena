name: Test and publish the playable build

# Every push to main runs the test suite and, if it passes, republishes the browser
# build to GitHub Pages. That is the whole sharing loop: one permanent URL that is
# always the latest version, and nothing for a player to download or install.
#
# Pull requests run everything except the publishing, so a change to this file is
# exercised before it is merged rather than after.

on:
  push:
    branches: [main]
  # Pull requests run the tests and the export, but never publish. Without this the
  # first time anything here is exercised is after it has already been merged.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref, so a pull request build cannot cancel the deploy of a push to main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Test and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          mkdir -p ~/godot-bin
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project
        # First import always reports errors for not-yet-registered classes; the second
        # pass is the one that has to be clean.
        run: |
          godot --headless --import || true
          godot --headless --import

      - name: Run tests
        run: godot --headless res://tests/test_main.tscn -- --test

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          # The share metadata is a string in export_presets.cfg, so nothing else would
          # notice if it stopped being emitted. Without it the URL unfurls as a bare
          # link, which is the whole point of having it.
          grep -q 'property="og:image"' build/web/index.html
          grep -q 'name="twitter:card"' build/web/index.html

      - name: Capture the link preview image
        # The og:image the page advertises has to exist inside the uploaded artifact, or
        # every share unfurls with a broken image. It is a real rendered frame of the
        # arena rather than a drawing, so this is the one step that needs a display.
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          }
          xvfb-run -a godot --audio-driver Dummy --resolution 1280x720 \
            res://tools/capture_promo_shot.tscn -- --out build/web/og-image.png
          test -f build/web/og-image.png

      - name: Stop Pages serving the build as Jekyll
        run: touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    name: Publish to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
